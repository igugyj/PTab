name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(jq -r '.version' public/manifest.json)
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match public/manifest.json version ${VERSION}"
            exit 1
          fi

      - name: Build Chrome / Edge
        run: npm run build:chrome

      - name: Build Firefox
        run: npm run build:firefox

      - name: Package
        run: |
          (cd output/chrome && zip -r ../../ptab-chrome.zip .)
          (cd output/firefox && zip -r ../../ptab-firefox.zip .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ptab-builds
          path: |
            ptab-chrome.zip
            ptab-firefox.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" ptab-chrome.zip ptab-firefox.zip --clobber
          else
            gh release create "${TAG}" ptab-chrome.zip ptab-firefox.zip \
              --title "PTab ${TAG}" --generate-notes
          fi
